<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HSR — Dashboard de Desempenho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root {
            --void: #0a0c16;
            --void-deep: #060810;
            --panel: #12162a;
            --panel-raised: #171c38;
            --panel-line: rgba(212, 175, 106, 0.14);
            --gold: #d4af6a;
            --gold-bright: #e8c98a;
            --gold-dim: rgba(212, 175, 106, 0.5);
            --violet: #7c6ff0;
            --teal: #5fd0c0;
            --text: #ede9dd;
            --muted: #8b93ac;
            --muted-dim: #5c6379;
            --danger: #e0827a;
            --radius: 14px;
            --font-display: 'Cinzel', serif;
            --font-body: 'Manrope', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: var(--font-body);
            color: var(--text);
            background:
                radial-gradient(1px 1px at 8% 12%, rgba(237, 233, 221, 0.55) 0, transparent 60%),
                radial-gradient(1px 1px at 22% 68%, rgba(237, 233, 221, 0.4) 0, transparent 60%),
                radial-gradient(1.5px 1.5px at 38% 24%, rgba(212, 175, 106, 0.6) 0, transparent 60%),
                radial-gradient(1px 1px at 54% 82%, rgba(237, 233, 221, 0.35) 0, transparent 60%),
                radial-gradient(1px 1px at 68% 14%, rgba(124, 111, 240, 0.55) 0, transparent 60%),
                radial-gradient(1.5px 1.5px at 81% 58%, rgba(237, 233, 221, 0.5) 0, transparent 60%),
                radial-gradient(1px 1px at 92% 30%, rgba(212, 175, 106, 0.5) 0, transparent 60%),
                radial-gradient(1px 1px at 12% 90%, rgba(237, 233, 221, 0.4) 0, transparent 60%),
                radial-gradient(ellipse 900px 500px at 50% -10%, rgba(124, 111, 240, 0.16), transparent 60%),
                linear-gradient(180deg, var(--void-deep), var(--void) 40%, var(--void-deep));
            background-attachment: fixed;
            padding: 40px 16px;
        }

        .hsr-shell {
            max-width: 1040px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(23, 28, 56, 0.9), rgba(18, 22, 42, 0.92));
            border: 1px solid var(--panel-line);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.4),
                0 30px 80px -30px rgba(0, 0, 0, 0.8),
                0 0 60px -20px rgba(124, 111, 240, 0.15);
            padding: 36px 40px 44px;
            position: relative;
            overflow: hidden;
        }

        .hsr-shell::before {
            content: "";
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 640px;
            height: 240px;
            background: radial-gradient(ellipse at center, rgba(212, 175, 106, 0.16), transparent 70%);
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        .hsr-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            flex-wrap: wrap;
            padding-bottom: 22px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--panel-line);
            position: relative;
            z-index: 1;
        }

        .hsr-eyebrow {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold-dim);
            margin-bottom: 8px;
        }

        .hsr-title {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 30px;
            margin: 0;
            letter-spacing: 0.01em;
            background: linear-gradient(120deg, var(--gold-bright), var(--gold) 45%, #b98f4e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hsr-mode {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hsr-mode-label {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .hsr-select {
            appearance: none;
            -webkit-appearance: none;
            background: var(--panel-raised) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23d4af6a"/></svg>') no-repeat right 14px center;
            border: 1px solid var(--panel-line);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 14px;
            padding: 10px 34px 10px 16px;
            border-radius: 10px;
            min-width: 220px;
            cursor: pointer;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .hsr-select:hover {
            border-color: var(--gold-dim);
        }

        .hsr-select:focus-visible {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 106, 0.2);
        }

        .hsr-select option {
            background: var(--panel-raised);
            color: var(--text);
        }

        /* ===== TRACK NAV (signature element) ===== */
        #myTab.nav.nav-tabs {
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin: 0 0 34px;
            padding: 0 4px;
            gap: 4px;
            z-index: 1;
        }

        #myTab.nav.nav-tabs::before {
            content: "";
            position: absolute;
            left: 22px;
            right: 22px;
            top: 15px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--panel-line) 12%, var(--panel-line) 88%, transparent);
        }

        #myTab .nav-item {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        #myTab .nav-link {
            all: unset;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 0 8px 4px;
            position: relative;
            color: var(--muted);
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.03em;
            transition: color .2s ease;
        }

        #myTab .nav-link::before {
            content: "";
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--panel);
            border: 2px solid var(--muted-dim);
            transition: all .25s ease;
            box-shadow: 0 0 0 4px var(--void);
        }

        #myTab .nav-link:hover {
            color: var(--text);
        }

        #myTab .nav-link:hover::before {
            border-color: var(--gold-dim);
        }

        #myTab .nav-link.active {
            color: var(--gold-bright);
        }

        #myTab .nav-link.active::before {
            background: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 0 4px var(--void), 0 0 14px 2px rgba(212, 175, 106, 0.55);
        }

        #myTab .nav-link:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 4px;
            border-radius: 4px;
        }

        /* ===== PANELS ===== */
        .tab-content {
            position: relative;
            z-index: 1;
        }

        .tab-pane {
            animation: hsr-fade .35s ease;
        }

        @keyframes hsr-fade {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .hsr-panel {
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: var(--radius);
            padding: 26px;
        }

        #chart {
            min-height: 420px;
        }

        .hsr-empty {
            padding: 70px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .hsr-empty span {
            display: block;
            font-family: var(--font-display);
            color: var(--gold-dim);
            font-size: 20px;
            margin-bottom: 8px;
        }

        /* ===== FORM ELEMENTS ===== */
        .hsr-field-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .hsr-select-full,
        .hsr-input {
            width: 100%;
            background: var(--panel-raised);
            border: 1px solid var(--panel-line);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 14px;
            padding: 11px 14px;
            border-radius: 10px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .hsr-select-full {
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23d4af6a"/></svg>');
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 32px;
        }

        .hsr-input {
            font-family: var(--font-mono);
        }

        .hsr-select-full:hover,
        .hsr-input:hover {
            border-color: var(--gold-dim);
        }

        .hsr-select-full:focus-visible,
        .hsr-input:focus-visible,
        .hsr-select-full:focus,
        .hsr-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 106, 0.16);
        }

        .hsr-select-full option {
            background: var(--panel-raised);
        }

        .hsr-input::placeholder {
            color: var(--muted-dim);
        }

        .hsr-btn {
            all: unset;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.02em;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            transition: filter .2s ease, transform .1s ease;
        }

        .hsr-btn:active {
            transform: translateY(1px);
        }

        .hsr-btn-primary {
            background: linear-gradient(135deg, var(--violet), #5b4fd6);
            color: #f4f2ff;
            box-shadow: 0 8px 24px -10px rgba(124, 111, 240, 0.7);
        }

        .hsr-btn-primary:hover {
            filter: brightness(1.1);
        }

        .hsr-btn-gold {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: #241a06;
            box-shadow: 0 8px 24px -10px rgba(212, 175, 106, 0.6);
        }

        .hsr-btn-gold:hover {
            filter: brightness(1.08);
        }

        .hsr-btn:focus-visible {
            outline: 2px solid var(--gold-bright);
            outline-offset: 3px;
        }

        /* ===== SIMULATION RESULTS ===== */
        .hsr-result {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--panel-raised);
            border: 1px solid var(--panel-line);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
        }

        .hsr-rank {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--void);
            background: var(--gold-dim);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 700;
        }

        .hsr-result:nth-child(1) .hsr-rank {
            background: var(--gold-bright);
        }

        .hsr-result-body {
            flex: 1;
            min-width: 0;
        }

        .hsr-result-score {
            font-family: var(--font-mono);
            font-size: 17px;
            font-weight: 600;
            color: var(--teal);
            margin-bottom: 4px;
        }

        .hsr-result-team {
            font-size: 13px;
            color: var(--text);
        }

        .hsr-chip {
            display: inline-block;
            background: rgba(124, 111, 240, 0.14);
            border: 1px solid rgba(124, 111, 240, 0.3);
            color: #c9c3ff;
            font-size: 12px;
            padding: 2px 9px;
            border-radius: 999px;
            margin: 2px 4px 2px 0;
        }

        .hsr-chip-buff {
            background: rgba(212, 175, 106, 0.14);
            border-color: rgba(212, 175, 106, 0.35);
            color: var(--gold-bright);
        }

        .hsr-alert {
            background: rgba(224, 130, 122, 0.12);
            border: 1px solid rgba(224, 130, 122, 0.4);
            color: #f2b3ac;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
        }

        /* ===== TOAST ===== */
        .hsr-toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--panel-raised);
            border: 1px solid var(--gold-dim);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            padding: 13px 22px;
            border-radius: 10px;
            box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
            z-index: 50;
        }

        .hsr-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hsr-toast::before {
            content: "✦ ";
            color: var(--gold);
        }

        @media (max-width: 620px) {
            .hsr-shell {
                padding: 26px 18px 32px;
            }

            .hsr-header {
                align-items: flex-start;
            }

            #myTab .nav-link span.hsr-station-label {
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tab-pane {
                animation: none;
            }

            .hsr-btn,
            .hsr-select,
            .hsr-toast {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="hsr-shell">
        <header class="hsr-header">
            <div>
                <span class="hsr-eyebrow">Astral Express · Registro de Batalhas</span>
                <h1 class="hsr-title">HSR Performance Dashboard</h1>
            </div>
            <div class="hsr-mode">
                <label for="select-modo" class="hsr-mode-label">Modo</label>
                <select id="select-modo" class="hsr-select" onchange="carregarModo()">
                    <option value="sombra_apocaliptica">Sombra Apocalíptica</option>
                    <option value="pura_ficcao">Pura Ficção</option>
                    <option value="memoria_do_caos">Memória do Caos</option>
                </select>
            </div>
        </header>

        <ul class="nav nav-tabs" id="myTab">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab"
                    data-bs-target="#tab-grafico"><span class="hsr-station-label">Gráfico</span></button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-simular"><span
                        class="hsr-station-label">Simular IA</span></button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cadastrar"><span
                        class="hsr-station-label">Cadastrar Reg</span></button></li>
        </ul>

        <div class="tab-content">
            <!-- ABA GRAFICO -->
            <div class="tab-pane fade show active" id="tab-grafico">
                <div class="hsr-panel">
                    <div id="chart"></div>
                </div>
            </div>

            <!-- ABA SIMULAR -->
            <div class="tab-pane fade" id="tab-simular">
                <div class="hsr-panel">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="hsr-field-label">Batalha</label>
                            <select id="sim-batalha" class="hsr-select-full">
                                <option>1ª Batalha</option>
                                <option>2ª Batalha</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="hsr-field-label">Quantidade de Resultados</label>
                            <input type="number" id="sim-top" class="hsr-input" value="10">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button class="hsr-btn hsr-btn-primary" onclick="executarSimulacao()">Executar Simulação
                                IA</button>
                        </div>
                    </div>
                    <div id="sim-resultados" class="mt-4"></div>
                </div>
            </div>

            <!-- ABA CADASTRAR -->
            <div class="tab-pane fade" id="tab-cadastrar">
                <div class="hsr-panel">
                    <form id="form-cadastro" onsubmit="salvarRegistro(event)">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="hsr-field-label">Batalha</label>
                                <select id="cad-batalha" class="hsr-select-full">
                                    <option>1ª Batalha</option>
                                    <option>2ª Batalha</option>
                                </select>
                            </div>
                            <div class="col-md-6" id="box-buff">
                                <label class="hsr-field-label">Buff</label>
                                <select id="cad-buff" class="hsr-select-full"></select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col"><select id="p1" class="hsr-select-full sel-p" required></select></div>
                            <div class="col"><select id="p2" class="hsr-select-full sel-p" required></select></div>
                            <div class="col"><select id="p3" class="hsr-select-full sel-p" required></select></div>
                            <div class="col"><select id="p4" class="hsr-select-full sel-p" required></select></div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col"><input type="number" step="0.1" id="t1" class="hsr-input"
                                    placeholder="Tentativa 1" required></div>
                            <div class="col"><input type="number" step="0.1" id="t2" class="hsr-input"
                                    placeholder="Tentativa 2" required></div>
                            <div class="col"><input type="number" step="0.1" id="t3" class="hsr-input"
                                    placeholder="Tentativa 3" required></div>
                        </div>
                        <button type="submit" class="hsr-btn hsr-btn-gold">Salvar Tentativa</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="hsr-toast" id="hsr-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function mostrarToast(msg) {
            const t = document.getElementById('hsr-toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__hsrToastTimer);
            window.__hsrToastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        async function carregarModo() {
            const modo = document.getElementById('select-modo').value;
            const res = await fetch(`/api/dados-iniciais/${modo}`);
            const data = await res.json();

            // Preenche seletores de personagens e buffs
            const selP = document.querySelectorAll('.sel-p');
            selP.forEach(s => {
                s.innerHTML = '<option value="">Selecione...</option>' + data.personagens.map(p => `<option value="${p}">${p}</option>`).join('');
            });

            const selBuff = document.getElementById('cad-buff');
            selBuff.innerHTML = data.efeitos.map(e => `<option value="${e}">${e}</option>`).join('');
            document.getElementById('box-buff').style.display = data.config.tem_efeitos ? 'block' : 'none';

            // Desenha o gráfico
            if (data.grafico && data.grafico.indices && data.grafico.indices.length) {
                const g = data.grafico;
                const corBatalha = (b) => b === '1ª Batalha' ? '#d4af6a' : '#7c6ff0';
                const coresPorTentativa = (g.batalha && g.batalha.length ? g.batalha : g.indices.map(() => '1ª Batalha')).map(corBatalha);
                const hoverEquipe = (g.equipe && g.equipe.length) ? g.equipe : g.indices.map(i => `Tentativa ${i + 1}`);
                const metricaMenorMelhor = data.config['métrica_menor_é_melhor'];
                const tituloEixoY = data.config.coluna_alvo === 'ciclos_medios' ? 'Ciclos (menor é melhor)' : 'Pontuação média';

                const traces = [
                    {
                        x: g.indices, y: g.t1, name: 'Tentativa 1', mode: 'lines+markers', showlegend: false, hoverinfo: 'skip',
                        line: { color: 'rgba(212,175,106,0.3)', width: 1 }, marker: { size: 4, color: 'rgba(212,175,106,0.45)' }
                    },
                    {
                        x: g.indices, y: g.t2, name: 'Tentativa 2', mode: 'lines+markers', showlegend: false, hoverinfo: 'skip',
                        line: { color: 'rgba(124,111,240,0.3)', width: 1 }, marker: { size: 4, color: 'rgba(124,111,240,0.45)' }
                    },
                    {
                        x: g.indices, y: g.t3, name: 'Tentativa 3', mode: 'lines+markers', showlegend: false, hoverinfo: 'skip',
                        line: { color: 'rgba(95,208,192,0.3)', width: 1 }, marker: { size: 4, color: 'rgba(95,208,192,0.45)' }
                    },
                    {
                        x: g.indices, y: g.media, name: 'Média', mode: 'lines+markers',
                        line: { color: '#ede9dd', width: 2.5, shape: 'spline' },
                        marker: { size: 9, color: coresPorTentativa, line: { color: '#0a0c16', width: 1.5 } },
                        error_y: (g.desvio && g.desvio.length) ? { type: 'data', array: g.desvio, color: 'rgba(237,233,221,0.35)', thickness: 1.3, width: 3 } : undefined,
                        fill: 'tozeroy', fillcolor: 'rgba(212,175,106,0.05)',
                        text: hoverEquipe,
                        hovertemplate: '<b>%{text}</b><br>Média: %{y:.2f} ± %{error_y.array:.2f}<extra></extra>'
                    },
                    (g.recorde && g.recorde.length) ? {
                        x: g.indices, y: g.recorde, name: 'Recorde', mode: 'lines',
                        line: { dash: 'dot', color: '#5fd0c0', width: 1.5 }, hoverinfo: 'skip'
                    } : null,
                    { x: [null], y: [null], mode: 'markers', marker: { color: '#d4af6a', size: 9 }, name: '1ª Batalha' },
                    { x: [null], y: [null], mode: 'markers', marker: { color: '#7c6ff0', size: 9 }, name: '2ª Batalha' }
                ].filter(Boolean);

                Plotly.newPlot('chart', traces, {
                    title: { text: `Desempenho — ${data.config.nome}`, font: { family: 'Cinzel, serif', color: '#e8c98a', size: 18 } },
                    paper_bgcolor: 'transparent',
                    plot_bgcolor: 'transparent',
                    font: { family: 'Manrope, sans-serif', color: '#8b93ac' },
                    xaxis: {
                        title: { text: 'Tentativa #', font: { size: 12 } },
                        gridcolor: 'rgba(212,175,106,0.08)', zerolinecolor: 'rgba(212,175,106,0.15)',
                        rangeslider: g.indices.length > 8 ? { visible: true, bgcolor: 'rgba(23,28,56,0.5)', bordercolor: 'rgba(212,175,106,0.2)', thickness: 0.07 } : undefined
                    },
                    yaxis: { title: { text: tituloEixoY, font: { size: 12 } }, gridcolor: 'rgba(212,175,106,0.08)', zerolinecolor: 'rgba(212,175,106,0.15)' },
                    legend: { orientation: 'h', y: -0.28, font: { color: '#8b93ac' } },
                    margin: { t: 56, l: 60, r: 24, b: 56 },
                    hoverlabel: { bgcolor: '#171c38', bordercolor: '#d4af6a', font: { color: '#ede9dd', family: 'Manrope, sans-serif' } }
                }, { responsive: true, displaylogo: false });
            } else {
                document.getElementById('chart').innerHTML = '<div class="hsr-empty"><span>Nenhum registro por enquanto</span>Cadastre uma tentativa para ver o desempenho neste modo.</div>';
            }
        }

        async function executarSimulacao() {
            const modo = document.getElementById('select-modo').value;
            const batalha = document.getElementById('sim-batalha').value;
            const top_n = document.getElementById('sim-top').value;

            const div = document.getElementById('sim-resultados');
            div.innerHTML = '<div class="hsr-empty">Calculando previsões...</div>';

            const res = await fetch('/api/simular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ modo, batalha, top_n })
            });

            const data = await res.json();

            if (data.error) {
                div.innerHTML = `<div class="hsr-alert">${data.error}</div>`;
                return;
            }

            let html = '';
            data.forEach((item, i) => {
                html += `<div class="hsr-result">
            <div class="hsr-rank">${i + 1}</div>
            <div class="hsr-result-body">
                <div class="hsr-result-score">Previsão: ${item.previsto.toFixed(2)}</div>
                <div class="hsr-result-team">
                    <span class="hsr-chip">${item.personagem_1}</span><span class="hsr-chip">${item.personagem_2}</span><span class="hsr-chip">${item.personagem_3}</span><span class="hsr-chip">${item.personagem_4}</span>${item.efeito_buff ? `<span class="hsr-chip hsr-chip-buff">${item.efeito_buff}</span>` : ''}
                </div>
            </div>
        </div>`;
            });
            div.innerHTML = html || '<div class="hsr-empty">Nenhum resultado encontrado.</div>';
        }

        async function salvarRegistro(e) {
            e.preventDefault();
            const payload = {
                modo: document.getElementById('select-modo').value,
                batalha: document.getElementById('cad-batalha').value,
                buff: document.getElementById('cad-buff').value,
                p1: document.getElementById('p1').value,
                p2: document.getElementById('p2').value,
                p3: document.getElementById('p3').value,
                p4: document.getElementById('p4').value,
                t1: document.getElementById('t1').value,
                t2: document.getElementById('t2').value,
                t3: document.getElementById('t3').value,
            };

            await fetch('/api/cadastrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            mostrarToast('Registro salvo com sucesso!');
            carregarModo();
        }

        // Inicializa a página
        carregarModo();
    </script>
</body>

</html>
